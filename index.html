<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="Discover, download, and share Minecraft Bedrock creations from the VOXEL community.">
  <title>VOXEL — Minecraft Bedrock Mods</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark;--bg:#10110f;--surface:#191b18;--surface2:#222520;--line:#393d35;--text:#f4f4ed;--muted:#a3a99b;--green:#a8e65c;--red:#ff8178;font:15px/1.55 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.wrap{width:min(1100px,calc(100% - 36px));margin:auto}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#10110fee;backdrop-filter:blur(12px);z-index:2}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:23px;font-weight:900;color:var(--text);text-decoration:none}.logo span{color:var(--green)}.button{border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:9px 13px;font-weight:700}.button:hover{border-color:var(--green)}.primary{background:var(--green);color:#15200c;border-color:var(--green)}main{padding:42px 0}.hero{padding:38px;border:1px solid #59604a;border-radius:16px;background:linear-gradient(120deg,#252b20,#181b17 60%,#25271d)}h1{font-size:clamp(36px,6vw,60px);line-height:1.04;margin:10px 0}h1 em{color:var(--green);font-style:normal}.muted{color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:32px 0 15px;gap:12px}.controls{display:flex;gap:9px;margin:18px 0}.control{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}.controls input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.cover{height:155px;width:100%;object-fit:cover;background:var(--surface2)}.card-body{padding:14px}.card h3{margin:0;font-size:18px}.card p{color:#c0c5b9;min-height:44px;font-size:13px}.tag{color:var(--green);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--muted)}.status.error{color:var(--red)}dialog{width:min(680px,calc(100% - 24px));max-height:90vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}.dialog-head{position:sticky;top:0;background:var(--surface);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-body{padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#11130f;color:var(--text)}.field textarea{min-height:100px}.field small{color:var(--muted)}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#242a20;border:1px solid var(--line);border-radius:9px;padding:11px 16px;z-index:4;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{color:#ffd2c9;border-color:#7d463e}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:13px}@media(max-width:600px){.hero{padding:25px 20px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.controls{flex-wrap:wrap}.controls input{min-width:100%}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><a class="logo" href="#">VOX<span>EL</span></a><button class="button primary" id="uploadBtn" type="button">＋ Share a mod</button></div></header>
  <main class="wrap">
    <section class="hero"><span class="tag">THE COMMUNITY LIBRARY</span><h1>Make your world<br><em>more yours.</em></h1><p class="muted">Discover, download, and share Minecraft Bedrock add-ons, worlds, and resource packs.</p><button class="button primary" id="heroShareBtn" type="button">Share your creation</button></section>
    <section><div class="section-head"><div><h2>Community picks</h2><span class="muted" id="count"></span></div><button class="button" id="refreshBtn" type="button">↻ Refresh</button></div><div class="controls"><input class="control" id="search" type="search" placeholder="Search mods and creators"><select class="control" id="category"><option value="">All categories</option></select><select class="control" id="sort"><option value="popular">Most downloaded</option><option value="newest">Recently added</option><option value="name">Name A–Z</option></select></div><p class="status" id="status" role="status">Connecting to the library…</p><div class="grid" id="grid"></div></section>
  </main>
  <footer><div class="wrap">VOXEL — community mod sharing for Minecraft Bedrock. Be kind. Credit creators.</div></footer>
  <dialog id="modal"><div class="dialog-head"><strong id="dialogTitle"></strong><button class="button" id="closeBtn" type="button" aria-label="Close">✕</button></div><div class="dialog-body" id="dialogBody"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const SUPABASE_URL='https://iiwqjdcbpgggtdgvvepj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_xL0llFesqeefrm03syTQew_jby4FhJp';
const ADMIN_CODE='voxeladmin';
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categories=['Add-ons','Behavior Packs','Resource Packs','Worlds','Tools','Other'];
let mods=[],toastTimer;
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.classList.toggle('error',error);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}
function adminAuthorized(){const code=window.prompt('Enter admin code to continue:');if(code===null)return false;if(code!==ADMIN_CODE){toast('Incorrect admin code.',true);return false}return true}
function showStatus(message,error=false){const el=$('#status');el.textContent=message;el.hidden=!message;el.classList.toggle('error',error)}
function render(){const q=$('#search').value.trim().toLowerCase(),category=$('#category').value,sort=$('#sort').value;const found=mods.filter(m=>(!category||m.category===category)&&[m.name,m.author,m.description,m.category].some(v=>String(v||'').toLowerCase().includes(q)));found.sort((a,b)=>sort==='newest'?new Date(b.created_at||0)-new Date(a.created_at||0):sort==='name'?String(a.name).localeCompare(String(b.name)):Number(b.downloads||0)-Number(a.downloads||0));$('#count').textContent=`${found.length} ${found.length===1?'project':'projects'}`;$('#grid').innerHTML=found.map(m=>`<article class="card"><img class="cover" src="${esc(m.banner_url||m.icon_url||'')}" alt="${esc(m.name)}" onerror="this.style.display='none'"><div class="card-body"><span class="tag">${esc(m.category||'Other')}</span><h3>${esc(m.name)}</h3><div class="muted">by ${esc(m.author||'Community creator')} · ${Number(m.downloads)||0} downloads</div><p>${esc(m.description||'A community-made creation for your next Bedrock adventure.')}</p><div class="actions"><button class="button primary" data-action="download" data-id="${esc(m.id)}" ${m.file_url?'':'disabled'}>↓ Download</button><button class="button" data-action="edit" data-id="${esc(m.id)}">Edit</button><button class="button" data-action="delete" data-id="${esc(m.id)}">Delete</button></div></div></article>`).join('')||'<p class="status">No projects match your search.</p>'}
async function loadMods(){if(!db){showStatus('Supabase could not be initialized. Check your connection.',true);return}$('#refreshBtn').disabled=true;showStatus('Loading the community library…');try{const {data,error}=await db.from('mods').select('*').order('created_at',{ascending:false});if(error)throw error;mods=data||[];const current=$('#category').value;const available=[...new Set([...categories,...mods.map(m=>m.category).filter(Boolean)])].sort();$('#category').innerHTML='<option value="">All categories</option>'+available.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('#category').value=current;showStatus(mods.length?'':'No mods have been shared yet. Be the first!');render()}catch(error){showStatus(`Could not load mods: ${error.message||error}`,true)}finally{$('#refreshBtn').disabled=false}}
function filePath(file){const clean=file.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'-').slice(-100)||'upload';return `${crypto.randomUUID()}-${clean}`}
async function uploadAsset(file){if(!file)return null;if(file.size>100*1024*1024)throw new Error('Files must be no larger than 100 MB.');const path=filePath(file);const {error}=await db.storage.from('mods').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||'application/octet-stream'});if(error)throw error;const {data}=db.storage.from('mods').getPublicUrl(path);return {path,url:data.publicUrl}}
async function removeAssets(paths){const clean=[...new Set(paths.filter(Boolean))];if(!clean.length)return;const {error}=await db.storage.from('mods').remove(clean);if(error)console.warn('Could not remove an old storage object:',error)}
function openForm(mod=null){const editing=Boolean(mod);$('#dialogTitle').textContent=editing?'Edit project':'Share a creation';$('#dialogBody').innerHTML=`<form id="modForm" novalidate><div class="form-grid"><label class="field"><span>Project name *</span><input name="name" maxlength="120" required value="${esc(mod?.name)}"></label><label class="field"><span>Creator</span><input name="author" maxlength="120" value="${esc(mod?.author)}" placeholder="Your name"></label><label class="field"><span>Category</span><select name="category">${categories.map(c=>`<option ${mod?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field"><span>Game version</span><input name="version" maxlength="40" value="${esc(mod?.version)}" placeholder="e.g. 1.21+"></label><label class="field full"><span>Description</span><textarea name="description" maxlength="10000">${esc(mod?.description)}</textarea></label><label class="field full"><span>Mod file ${editing?'(optional — choose to replace)':'*'}</span><input name="mod_file" type="file" accept=".mcpack,.mcaddon,.zip" ${editing?'':'required'}><small>.mcpack, .mcaddon, or .zip · up to 100 MB</small></label><label class="field"><span>Project icon</span><input name="icon_file" type="file" accept="image/*"><small>Optional image, up to 100 MB</small></label><label class="field"><span>Cover image</span><input name="banner_file" type="file" accept="image/*"><small>Optional image, up to 100 MB</small></label></div><div class="form-actions"><button class="button" type="button" data-close>Cancel</button><button class="button primary" type="submit">${editing?'Save changes':'Publish project'}</button></div></form>`;$('#modForm').dataset.modId=mod?.id||'';$('#modal').showModal();$('#modForm [name=name]').focus()}
async function submitMod(event){event.preventDefault();const form=event.currentTarget;if(!adminAuthorized())return;const button=form.querySelector('[type=submit]');button.disabled=true;const editing=Boolean(form.dataset.modId),old=mods.find(m=>String(m.id)===form.dataset.modId);button.textContent=editing?'Saving…':'Uploading…';const created=[];try{const f=new FormData(form),modFile=f.get('mod_file'),iconFile=f.get('icon_file'),bannerFile=f.get('banner_file');for(const file of [modFile,iconFile,bannerFile])if(file?.size>100*1024*1024)throw new Error('Each file must be no larger than 100 MB.');const file=modFile?.size?await uploadAsset(modFile):null;if(file)created.push(file.path);const icon=iconFile?.size?await uploadAsset(iconFile):null;if(icon)created.push(icon.path);const banner=bannerFile?.size?await uploadAsset(bannerFile):null;if(banner)created.push(banner.path);const record={name:f.get('name').trim(),author:f.get('author').trim(),category:f.get('category'),version:f.get('version').trim(),description:f.get('description').trim()};if(file){record.file_path=file.path;record.file_url=file.url}if(icon){record.icon_path=icon.path;record.icon_url=icon.url}if(banner){record.banner_path=banner.path;record.banner_url=banner.url}let result;if(editing)result=await db.from('mods').update(record).eq('id',form.dataset.modId).select().single();else result=await db.from('mods').insert(record).select().single();if(result.error)throw result.error;const saved=result.data;if(editing){mods=mods.map(m=>String(m.id)===String(saved.id)?saved:m);await removeAssets([file&&old.file_path,icon&&old.icon_path,banner&&old.banner_path])}else mods.unshift(saved);$('#modal').close();render();showStatus('');toast(editing?'Changes saved.':'Your project is live!')}catch(error){await removeAssets(created);console.error('Could not save project:',error);toast(error.message||'Could not save project. Check Supabase storage and database policies.',true);button.disabled=false;button.textContent=editing?'Save changes':'Publish project'}}
async function deleteMod(mod){if(!adminAuthorized())return;if(!window.confirm(`Permanently delete “${mod.name}” and its uploaded files? This cannot be undone.`))return;try{const {error}=await db.from('mods').delete().eq('id',mod.id);if(error)throw error;await removeAssets([mod.file_path,mod.icon_path,mod.banner_path]);mods=mods.filter(m=>String(m.id)!==String(mod.id));render();toast('Project deleted.')}catch(error){console.error('Delete failed:',error);toast(error.message||'Could not delete project.',true)}}
$('#uploadBtn').addEventListener('click',()=>{if(adminAuthorized())openForm()});$('#heroShareBtn').addEventListener('click',()=>{if(adminAuthorized())openForm()});$('#closeBtn').addEventListener('click',()=>$('#modal').close());$('#refreshBtn').addEventListener('click',loadMods);$('#search').addEventListener('input',render);$('#category').addEventListener('change',render);$('#sort').addEventListener('change',render);$('#dialogBody').addEventListener('click',e=>{if(e.target.closest('[data-close]'))$('#modal').close()});$('#dialogBody').addEventListener('submit',submitMod);$('#grid').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const mod=mods.find(m=>String(m.id)===b.dataset.id);if(!mod)return;if(b.dataset.action==='edit'){if(adminAuthorized())openForm(mod)}else if(b.dataset.action==='delete')deleteMod(mod);else if(b.dataset.action==='download'){try{const a=document.createElement('a');a.href=mod.file_url;a.download='';a.rel='noopener';document.body.append(a);a.click();a.remove();const {error}=await db.rpc('increment_mod_downloads',{p_mod_id:String(mod.id)});if(!error){mod.downloads=(Number(mod.downloads)||0)+1;render()}}catch(error){toast(error.message||'Download failed.',true)}}});
if(!db){showStatus('Supabase could not be initialized. Check your connection.',true);$('#uploadBtn').disabled=true}else loadMods();
</script>
</body>
</html>
