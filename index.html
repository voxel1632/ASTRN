<style>
:root{color-scheme:light;--ink:#17213a;--muted:#75809a;--line:#e6eaf2;--paper:#f5f7fc;--white:#fff;--blue:#4168ed;--blue2:#6f86ff;--purple:#8561e8;--cyan:#39c8dc;--green:#27a98a;--red:#dc5570;--shadow:0 12px 35px #26385c0c;font:14px/1.5 'DM Sans',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{color:inherit;text-decoration:none}.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:244px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 28px;font:800 21px Manrope,sans-serif;letter-spacing:-.7px}.brandmark{width:37px;height:37px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;display:grid;place-items:center;font-size:20px;box-shadow:0 7px 17px #4168ed44}.brand em{font-style:normal;color:var(--blue)}.nav-label{text-transform:uppercase;letter-spacing:1.2px;font-weight:700;font-size:10px;color:#a1aabe;padding:11px 12px 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#66718a;border-radius:9px;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:600;transition:.18s}.nav button:hover{background:#f3f5fc;color:var(--blue)}.nav button.active{background:#edf1ff;color:var(--blue);font-weight:700}.nav-icon{font-size:17px;width:20px;text-align:center}.side-bottom{margin-top:auto;padding:14px 10px 0;color:#9aa3b5;font-size:11px}.main{margin-left:244px;min-height:100vh}.topbar{height:74px;padding:0 clamp(20px,4vw,48px);background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4;backdrop-filter:blur(16px)}.page-title{font:750 20px Manrope,sans-serif;letter-spacing:-.5px}.top-actions{display:flex;align-items:center;gap:10px}.search-wrap{position:relative}.search-wrap input{width:min(270px,30vw);padding:10px 13px 10px 37px;border:1px solid var(--line);border-radius:10px;background:#f8f9fc;outline:none}.search-wrap input:focus,.input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #4168ed16}.search-icon{position:absolute;left:13px;top:8px;color:#8d97ad;font-size:17px}.avatar{height:36px;width:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--cyan))}.content{max-width:1450px;margin:auto;padding:30px clamp(20px,4vw,48px) 55px}.view-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:22px}.view-heading h1{font:800 27px Manrope,sans-serif;letter-spacing:-.8px;margin:0 0 4px}.view-heading p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:700;transition:.18s}.btn:hover{border-color:#b9c6eb;transform:translateY(-1px)}.btn-primary{background:linear-gradient(110deg,var(--blue),var(--purple));border-color:transparent;color:white;box-shadow:0 5px 13px #4168ed2a}.btn-small{font-size:12px;padding:6px 9px}.btn-danger{color:var(--red)}.icon-btn{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;color:#66718a}.grid{display:grid;gap:17px}.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat-card,.panel,.item-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat-card{padding:18px;position:relative;overflow:hidden}.stat-card:after{content:'';position:absolute;right:-20px;top:-30px;width:95px;height:95px;border-radius:50%;background:var(--tint,#eff2ff)}.stat-label{color:var(--muted);font-size:12px;font-weight:600;position:relative;z-index:1}.stat-value{font:800 27px Manrope,sans-serif;margin:8px 0 1px;position:relative;z-index:1;letter-spacing:-.8px}.stat-foot{color:#969fb1;font-size:11px;position:relative;z-index:1}.stat-icon{position:absolute;right:17px;top:17px;font-size:18px;z-index:1}.dashboard-grid{grid-template-columns:minmax(0,1.35fr) minmax(270px,.85fr)}.panel{padding:19px;margin-bottom:17px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel-head h2{font:750 15px Manrope,sans-serif;margin:0}.panel-head .sub{font-size:11px;color:var(--muted)}.hero{background:linear-gradient(115deg,#273e9b,#6048bd 60%,#8863d9);color:white;border-radius:17px;padding:25px 27px;margin-bottom:20px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:40px;top:-40px;font-size:170px;color:#ffffff15;transform:rotate(15deg)}.hero .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:#d4dcff;font-weight:700}.hero h1{font:800 27px Manrope,sans-serif;margin:9px 0 6px;max-width:580px}.hero p{color:#e0e5ff;margin:0;max-width:500px}.quote{padding:16px;border-radius:12px;background:linear-gradient(125deg,#f3f5ff,#f8f5ff);color:#4b5780}.quote blockquote{margin:0;font:650 15px Manrope,sans-serif}.quote cite{display:block;color:#8b92a6;font-style:normal;margin-top:8px;font-size:11px}.list{display:grid;gap:10px}.row-card{padding:12px 13px;border:1px solid #edf0f6;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:12px}.row-main{min-width:0}.row-main strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-main small{color:var(--muted);font-size:11px}.pill{display:inline-flex;align-items:center;border-radius:99px;background:#eef2ff;color:#4c65cb;padding:4px 8px;font-size:10px;font-weight:700;white-space:nowrap}.pill.green{background:#e8f7f2;color:#13856c}.pill.purple{background:#f2edff;color:#7555c6}.pill.orange{background:#fff4e8;color:#bc7b23}.pill.red{background:#fff0f2;color:#c04b60}.empty{padding:28px 16px;text-align:center;border:1px dashed #dfe4ef;border-radius:11px;color:#8b95a9;font-size:12px}.empty strong{display:block;color:#67728b;font-size:13px;margin-bottom:3px}.progress-track{height:7px;border-radius:8px;background:#edf0f7;overflow:hidden}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .4s}.skill-item{border:1px solid #edf0f6;border-radius:11px;padding:12px}.skill-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}.skill-top strong{font-size:13px}.skill-actions{display:flex;gap:6px}.skills-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}.item-card{padding:17px}.item-card h3{font:750 15px Manrope,sans-serif;margin:0 0 5px}.item-card p{color:#68738c;font-size:12px;white-space:pre-wrap;margin:8px 0}.item-meta{display:flex;align-items:center;gap:7px;color:#8992a5;font-size:11px;flex-wrap:wrap;margin-bottom:9px}.item-actions{display:flex;gap:6px;margin-top:12px}.video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#111827}.video-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#eef0f6}.video-list{grid-template-columns:repeat(2,minmax(0,1fr))}.post-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}.mini-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4d70ef,#48bed4);display:grid;place-items:center;color:white;font-size:12px;font-weight:800;flex:none}.post-actions{display:flex;gap:8px;align-items:center;margin-top:10px}.comment-list{display:grid;gap:7px;margin:10px 0}.comment{border-radius:8px;padding:8px 10px;background:#f6f7fb;font-size:11px}.comment-form{display:flex;gap:7px;margin-top:9px}.comment-form input{flex:1;min-width:0}.calendar{overflow:hidden}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.cal-title{font:750 15px Manrope,sans-serif}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-day-label{text-align:center;color:#969fb1;font-size:10px;padding:5px}.cal-cell{min-height:58px;border:1px solid #edf0f6;background:#fff;border-radius:9px;padding:7px;text-align:left;color:var(--ink);position:relative}.cal-cell:hover{border-color:#aab8f0;background:#f8f9ff}.cal-cell.muted{color:#c3c8d2;background:#fafbfc}.cal-cell.today{border-color:var(--blue);color:var(--blue);font-weight:800}.cal-cell.selected{background:#eef1ff;border-color:#8194f4}.cal-dot{position:absolute;bottom:7px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--cyan)}.chart-box{height:200px;display:flex;align-items:flex-end;gap:10px;padding:8px 3px 0}.bar-group{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}.bar-value{font-size:9px;color:#8b95a9}.bar{width:min(30px,75%);min-height:3px;background:linear-gradient(180deg,#61cfe0,#4d69e9);border-radius:6px 6px 2px 2px;transition:height .3s}.bar-label{font-size:9px;color:#8b95a9;white-space:nowrap}.search-results{display:grid;gap:10px}.search-hit{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff}.search-hit:hover{border-color:#b7c3ec}.search-type{font-size:10px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.7px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#606b83;font-weight:700}.input{width:100%;border:1px solid #dfe4ef;background:#fff;border-radius:8px;padding:10px 11px;color:var(--ink);outline:none}.field textarea{min-height:100px;resize:vertical}.modal{width:min(640px,calc(100% - 24px));max-height:90vh;overflow:auto;border:0;border-radius:15px;padding:0;box-shadow:0 25px 80px #101a3240}.modal::backdrop{background:#111c37a6;backdrop-filter:blur(4px)}.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:15px 19px;display:flex;align-items:center;justify-content:space-between;z-index:1}.modal-head h2{font:750 16px Manrope;margin:0}.modal-body{padding:19px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;z-index:9;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#17213a;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#a83650}.mobile-toggle{display:none}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f6}th{color:#8690a4;font-size:10px;text-transform:uppercase;letter-spacing:.6px}.danger-note{font-size:11px;color:#8b95a9}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filter-row .input{width:auto;min-width:150px}
@media(max-width:1050px){.sidebar{width:210px}.main{margin-left:210px}.stats-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{width:100%;height:auto;inset:auto 0 0;top:auto;border-right:0;border-top:1px solid var(--line);padding:6px 5px calc(6px + env(safe-area-inset-bottom));display:block}.brand,.nav-label,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:1px}.nav button{padding:7px 5px;flex-direction:column;gap:2px;font-size:9px;flex:1;text-align:center}.nav-icon{font-size:17px}.main{margin-left:0;padding-bottom:72px}.topbar{height:62px;padding:0 16px}.page-title{font-size:17px}.content{padding:20px 15px 35px}.dashboard-grid{grid-template-columns:1fr}.video-list,.two-col{grid-template-columns:1fr}.skills-grid{grid-template-columns:1fr}.search-wrap input{width:min(190px,42vw)}.stats-grid{gap:9px}.stat-card{padding:13px}.stat-value{font-size:22px}.hero{padding:21px}.hero h1{font-size:23px}.view-heading h1{font-size:23px}.cal-cell{min-height:45px;padding:5px;font-size:11px}.panel{padding:14px}}@media(max-width:420px){.nav button{font-size:8px}.search-wrap input{width:135px}.avatar{display:none}.stats-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.cal-grid{gap:3px}.cal-cell{min-height:39px}}
</style>

<body>
<div class="shell"><aside class="sidebar"><a href="#dashboard" class="brand"><span class="brandmark">G</span>GYM<em>TRACK</em></a><div class="nav-label">Workspace</div><nav class="nav" aria-label="Main navigation">
<button data-view="dashboard" class="active"><span class="nav-icon">◫</span>Dashboard</button><button data-view="progress"><span class="nav-icon">◷</span>Progress log</button><button data-view="skills"><span class="nav-icon">✦</span>Skills</button><button data-view="goals"><span class="nav-icon">◎</span>Goals</button><button data-view="calendar"><span class="nav-icon">▦</span>Calendar</button><button data-view="videos"><span class="nav-icon">▷</span>Videos</button><button data-view="articles"><span class="nav-icon">▤</span>Articles</button><button data-view="community"><span class="nav-icon">♧</span>Community</button><button data-view="stats"><span class="nav-icon">▥</span>Statistics</button></nav><div class="side-bottom">Your training, thoughtfully tracked.</div></aside>
<div class="main"><header class="topbar"><div class="page-title" id="pageTitle">Dashboard</div><div class="top-actions"><label class="search-wrap"><span class="search-icon">⌕</span><input id="globalSearch" type="search" placeholder="Search everything…" aria-label="Search skills, videos, articles, and posts"></label><div class="avatar" id="avatar">G</div></div></header><main class="content" id="content"></main></div></div><dialog class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" type="button" data-close aria-label="Close dialog">✕</button></div><div class="modal-body" id="modalBody"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const STORE='gymtrack-v1';
const categories=['Floor','Beam','Bars','Vault','Tumbling','Flexibility'];
const quoteList=[['Small progress is still progress. Show up, do the work, and trust the process.','GYMTRACK'],['You do not have to be perfect to be powerful. Keep practicing.','GYMTRACK'],['Every skill begins with the courage to try.','GYMTRACK'],['Strong bodies are built one focused practice at a time.','GYMTRACK'],['Celebrate the work you put in, not only the result.','GYMTRACK']];
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
let data=readData(),view='dashboard',monthCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),selectedDate=today(),toastTimer;
function fresh(){return {profile:{name:''},progress:[],skills:[],goals:[],videos:[],articles:[],posts:[]}}
function readData(){try{const d=JSON.parse(localStorage.getItem(STORE)||'null');if(!d||typeof d!=='object')return fresh();return {...fresh(),...d,profile:{...fresh().profile,...d.profile},progress:Array.isArray(d.progress)?d.progress:[],skills:Array.isArray(d.skills)?d.skills:[],goals:Array.isArray(d.goals)?d.goals:[],videos:Array.isArray(d.videos)?d.videos:[],articles:Array.isArray(d.articles)?d.articles:[],posts:Array.isArray(d.posts)?d.posts:[]}}catch{return fresh()}}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(data));return true}catch(e){notify('Could not save your changes. Free up browser storage and try again.',true);return false}}
function notify(msg,error=false){const t=$('#toast');t.textContent=msg;t.classList.toggle('error',error);t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}
function totalMinutes(){return data.progress.reduce((s,x)=>s+(Number(x.minutes)||0),0)}
function mastered(){return data.skills.filter(x=>x.status==='Mastered').length}
function doneGoals(){return data.goals.filter(x=>Number(x.progress)>=100).length}
function dayLabel(d){if(!d)return '';return new Date(`${d}T12:00:00`).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function safeYouTube(value){try{const u=new URL(value);let id='';if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.match(/\/(?:embed|shorts)\/([\w-]+)/)?.[1];if(u.hostname==='youtu.be')id=u.pathname.slice(1);return id&&/^[\w-]{11}$/.test(id)?{id,embed:`https://www.youtube-nocookie.com/embed/${id}`,thumb:`https://i.ytimg.com/vi/${id}/hqdefault.jpg`}:null}catch{return null}}
function empty(title,body,button=''){return `<div class="empty"><strong>${esc(title)}</strong>${esc(body)}${button?`<div style="margin-top:12px">${button}</div>`:''}</div>`}
function addButton(type,label){return `<button class="btn btn-primary" data-add="${type}" type="button">＋ ${label}</button>`}
function heading(title,desc,action=''){return `<div class="view-heading"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,foot,icon,tint){return `<article class="stat-card" style="--tint:${tint}"><span class="stat-icon">${icon}</span><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></article>`}
function recentProgress(limit=4){const rows=[...data.progress].sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt-a.updatedAt).slice(0,limit);return rows.length?`<div class="list">${rows.map(x=>`<div class="row-card"><div class="row-main"><strong>${esc(x.title||'Practice session')}</strong><small>${dayLabel(x.date)} · ${Number(x.minutes)||0} min${x.skills?.length?` · ${esc(x.skills.join(', '))}`:''}</small></div><span class="pill">${Math.floor((Number(x.minutes)||0)/60)}h ${(Number(x.minutes)||0)%60}m</span></div>`).join('')}</div>`:empty('Your training journey starts here','Log a practice session to see your progress.','<button class="btn btn-small" data-add="progress">＋ Log practice</button>')}
function renderDashboard(){const quote=quoteList[(new Date().getDate()+new Date().getMonth())%quoteList.length], posts=[...data.posts].sort((a,b)=>b.createdAt-a.createdAt).slice(0,3), videos=data.videos.slice(0,2);return `<section class="hero"><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>${data.profile.name?`Welcome back, ${esc(data.profile.name)}.`:'Your training journey starts here.'}</h1><p>Build consistency, celebrate every breakthrough, and make each practice count.</p><div style="margin-top:17px"><button class="btn" data-add="progress">＋ Log today's practice</button></div></section><div class="grid stats-grid">${stat('Practice hours',`${(totalMinutes()/60).toFixed(1)}h`,'Across all logged sessions','◷','#edf2ff')}${stat('Skills mastered',mastered(),`${data.skills.length} skills tracked`,'✦','#f2edff')}${stat('Active goals',data.goals.filter(g=>Number(g.progress)<100).length,`${doneGoals()} completed`,'◎','#e8f7f5')}${stat('Practice sessions',data.progress.length,'Logged in your journal','▦','#fff4e8')}</div><div class="quote" style="margin-bottom:18px"><blockquote>“${esc(quote[0])}”</blockquote><cite>— ${esc(quote[1])}</cite></div><div class="grid dashboard-grid"><div><section class="panel"><div class="panel-head"><h2>Recent practice</h2><button class="btn btn-small" data-go="progress">View log</button></div>${recentProgress()}</section><section class="panel"><div class="panel-head"><h2>Latest community posts</h2><button class="btn btn-small" data-go="community">Community</button></div>${posts.length?`<div class="list">${posts.map(postPreview).join('')}</div>`:empty('No posts yet','Create a progress update or achievement to get the conversation started.','<button class="btn btn-small" data-add="post">＋ Create post</button>')}</section></div><div><section class="panel"><div class="panel-head"><h2>Skills in focus</h2><button class="btn btn-small" data-go="skills">All skills</button></div>${data.skills.length?`<div class="list">${data.skills.slice(0,4).map(skillMini).join('')}</div>`:empty('Track your first skill','Add a skill and update its level as you improve.','<button class="btn btn-small" data-add="skill">＋ Add skill</button>')}</section><section class="panel"><div class="panel-head"><h2>Featured videos</h2><button class="btn btn-small" data-go="videos">Video library</button></div>${videos.length?`<div class="list">${videos.map(v=>`<div class="row-card"><div class="row-main"><strong>${esc(v.title)}</strong><small>${esc(v.category)}</small></div><button class="btn btn-small" data-play="${esc(v.id)}">Watch</button></div>`).join('')}</div>`:empty('Build your video library','Save a YouTube tutorial to watch it here later.','<button class="btn btn-small" data-add="video">＋ Save video</button>')}</section></div></div>`}
function postPreview(p){return `<div class="row-card"><div class="row-main"><strong>${esc(p.title)}</strong><small>${esc(p.author||'Gymnast')} · ${dayLabel(p.date||today())}</small></div><span class="pill purple">${esc(p.type)}</span></div>`}
function skillMini(s){return `<div class="skill-item"><div class="skill-top"><strong>${esc(s.name)}</strong><span class="pill ${s.status==='Mastered'?'green':s.status==='Almost There'?'purple':''}">${esc(s.status)}</span></div><div class="progress-track"><div class="progress-fill" style="width:${statusPercent(s.status)}%"></div></div><div class="item-meta" style="margin:7px 0 0">${esc(s.category)}</div></div>`}
function statusPercent(s){return ({'Not Started':0,'Learning':35,'Almost There':75,'Mastered':100})[s]||0}
function renderProgress(){const rows=[...data.progress].sort((a,b)=>b.date.localeCompare(a.date));return `${heading('Progress log','Record practice and notice your consistency.',addButton('progress','Log practice'))}<section class="panel"><div class="panel-head"><h2>Training history</h2><span class="sub">${rows.length} ${rows.length===1?'session':'sessions'}</span></div>${rows.length?`<div class="list">${rows.map(x=>`<article class="item-card"><div class="panel-head"><div><h3>${esc(x.title||'Practice session')}</h3><div class="item-meta"><span>${dayLabel(x.date)}</span><span>·</span><span>${Number(x.minutes)||0} minutes</span></div></div><div class="item-actions"><button class="btn btn-small" data-edit="progress" data-id="${esc(x.id)}">Edit</button><button class="btn btn-small btn-danger" data-delete="progress" data-id="${esc(x.id)}">Delete</button></div></div>${x.skills?.length?`<div class="item-meta">Skills: ${x.skills.map(esc).join(', ')}</div>`:''}<div class="item-meta">Strength: ${Number(x.strength)||0} min · Flexibility: ${Number(x.flexibility)||0} min</div>${x.notes?`<p>${esc(x.notes)}</p>`:''}</article>`).join('')}</div>`:empty('No sessions logged yet','Keep your training history together by recording your first session.','<button class="btn btn-small" data-add="progress">＋ Log practice</button>')}</section>`}
function renderSkills(){return `${heading('Skill tracker','Track your progress across every apparatus.',addButton('skill','Add skill'))}<div class="filter-row"><select class="input" id="skillFilter"><option value="">All categories</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select><select class="input" id="skillStatusFilter"><option value="">All levels</option>${['Not Started','Learning','Almost There','Mastered'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="grid skills-grid" id="skillGrid">${renderSkillCards()}</div>`}
function renderSkillCards(){const cat=$('#skillFilter')?.value||'',stat=$('#skillStatusFilter')?.value||'',rows=data.skills.filter(s=>(!cat||s.category===cat)&&(!stat||s.status===stat));return rows.length?rows.map(s=>`<article class="item-card"><div class="panel-head"><div><span class="pill">${esc(s.category)}</span><h3 style="margin-top:8px">${esc(s.name)}</h3></div><div class="item-actions"><button class="btn btn-small" data-edit="skill" data-id="${esc(s.id)}">Edit</button><button class="btn btn-small btn-danger" data-delete="skill" data-id="${esc(s.id)}">Delete</button></div></div><div class="skill-top"><span class="muted">${esc(s.status)}</span><strong>${statusPercent(s.status)}%</strong></div><div class="progress-track"><div class="progress-fill" style="width:${statusPercent(s.status)}%"></div></div>${s.notes?`<p>${esc(s.notes)}</p>`:''}</article>`).join(''):empty('No skills here yet','Add skills you are working on to track their progress.')}
function renderGoals(){const rows=[...data.goals].sort((a,b)=>Number(a.progress)-Number(b.progress));return `${heading('Goals','Set meaningful targets and track your progress.',addButton('goal','Create goal'))}<div class="grid two-col">${rows.length?rows.map(g=>`<article class="item-card"><div class="panel-head"><div><div class="item-meta">${g.due?`Target ${dayLabel(g.due)}`:'No target date'}</div><h3>${esc(g.title)}</h3></div><div class="item-actions"><button class="btn btn-small" data-edit="goal" data-id="${esc(g.id)}">Edit</button><button class="btn btn-small btn-danger" data-delete="goal" data-id="${esc(g.id)}">Delete</button></div></div>${g.description?`<p>${esc(g.description)}</p>`:''}<div class="skill-top" style="margin-top:13px"><span class="muted">${Number(g.progress)||0}% complete</span><button class="btn btn-small" data-step-goal="${esc(g.id)}">+10%</button></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,Number(g.progress)||0)}%"></div></div>${Number(g.progress)>=100?'<div style="margin-top:9px"><span class="pill green">Goal achieved</span></div>':''}</article>`).join(''):empty('No goals set','Create a goal to give your training a clear next milestone.','<button class="btn btn-small" data-add="goal">＋ Create goal</button>')}</div>`}
function renderVideos(){return `${heading('Video library','Save YouTube videos and watch them without leaving GYMTRACK.',addButton('video','Save video'))}<div class="filter-row"><select class="input" id="videoFilter"><option value="">All categories</option>${['Beginner','Intermediate','Advanced','Flexibility','Strength','Tutorials'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="grid video-list" id="videoGrid">${renderVideoCards()}</div>`}
function renderVideoCards(){const cat=$('#videoFilter')?.value||'',rows=data.videos.filter(v=>!cat||v.category===cat);return rows.length?rows.map(v=>`<article class="item-card"><button class="plain-video" data-play="${esc(v.id)}" aria-label="Watch ${esc(v.title)}" style="border:0;padding:0;background:transparent;width:100%"><img class="video-thumb" src="${esc(safeYouTube(v.url)?.thumb||'')}" alt="Thumbnail for ${esc(v.title)}"></button><div class="item-meta" style="margin-top:10px"><span class="pill purple">${esc(v.category)}</span></div><h3>${esc(v.title)}</h3>${v.description?`<p>${esc(v.description)}</p>`:''}<div class="item-actions"><button class="btn btn-small btn-primary" data-play="${esc(v.id)}">▷ Watch</button><button class="btn btn-small" data-edit="video" data-id="${esc(v.id)}">Edit</button><button class="btn btn-small btn-danger" data-delete="video" data-id="${esc(v.id)}">Delete</button></div></article>`).join(''):empty('No videos saved','Paste a YouTube link to build a useful training library.')}
function renderArticles(){return `${heading('Articles','Write and organize your gymnastics knowledge.',addButton('article','Write article'))}<div class="filter-row"><select class="input" id="articleFilter"><option value="">All topics</option>${['Training','Flexibility','Nutrition','Competitions','Mental Training'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="grid two-col" id="articleGrid">${renderArticleCards()}</div>`}
function renderArticleCards(){const topic=$('#articleFilter')?.value||'',rows=[...data.articles].filter(a=>!topic||a.topic===topic).sort((a,b)=>b.updatedAt-a.updatedAt);return rows.length?rows.map(a=>`<article class="item-card"><div class="item-meta"><span class="pill">${esc(a.topic)}</span><span>${dayLabel(a.date)}</span></div><h3>${esc(a.title)}</h3><div class="item-meta">By ${esc(a.author||'Gymnast')}</div><p>${esc(a.content)}</p><div class="item-actions"><button class="btn btn-small" data-read-article="${esc(a.id)}">Read</button><button class="btn btn-small" data-edit="article" data-id="${esc(a.id)}">Edit</button><button class="btn btn-small btn-danger" data-delete="article" data-id="${esc(a.id)}">Delete</button></div></article>`).join(''):empty('No articles yet','Create a training note or article to keep your knowledge organized.','<button class="btn btn-small" data-add="article">＋ Write article</button>')}
function renderCommunity(){const rows=[...data.posts].sort((a,b)=>b.createdAt-a.createdAt);return `${heading('Community','Share progress, celebrate achievements, and ask questions.',addButton('post','Create post'))}<div class="grid two-col">${rows.length?rows.map(postCard).join(''):empty('Your feed is ready','Your posts will appear here. Share a milestone or start a discussion.','<button class="btn btn-small" data-add="post">＋ Create post</button>')}</div>`}
function postCard(p){return `<article class="item-card"><div class="post-head"><span class="mini-avatar">${esc((p.author||'G').slice(0,1).toUpperCase())}</span><div class="row-main"><strong>${esc(p.author||'Gymnast')}</strong><small>${dayLabel(p.date||today())} · ${esc(p.type)}</small></div><div class="item-actions"><button class="btn btn-small" data-edit="post" data-id="${esc(p.id)}">Edit</button><button class="btn btn-small btn-danger" data-delete="post" data-id="${esc(p.id)}">Delete</button></div></div><h3>${esc(p.title)}</h3><p>${esc(p.content)}</p><div class="post-actions"><button class="btn btn-small" data-like="${esc(p.id)}">♥ ${p.likes?.length||0} ${p.likes?.includes('local-user')?'Liked':'Like'}</button><span class="muted" style="font-size:11px">${p.comments?.length||0} comments</span></div><div class="comment-list">${(p.comments||[]).map(c=>`<div class="comment"><strong>${esc(c.author||'Gymnast')}:</strong> ${esc(c.text)}</div>`).join('')}</div><form class="comment-form" data-comment="${esc(p.id)}"><input class="input" name="comment" required maxlength="500" placeholder="Write a comment…"><button class="btn btn-small" type="submit">Comment</button></form></article>`}
function renderCalendar(){const year=monthCursor.getFullYear(),month=monthCursor.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),prevDays=new Date(year,month,0).getDate(),labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let cells='';for(let i=0;i<42;i++){let d,cls='cal-cell';if(i<offset){d=`${year}-${String(month).padStart(2,'0')}-${String(prevDays-offset+i+1).padStart(2,'0')}`;cls+=' muted'}else if(i>=offset+days){const next=i-offset-days+1;d=`${year}-${String(month+2).padStart(2,'0')}-${String(next).padStart(2,'0')}`;cls+=' muted'}else d=`${year}-${String(month+1).padStart(2,'0')}-${String(i-offset+1).padStart(2,'0')}`;if(d===today())cls+=' today';if(d===selectedDate)cls+=' selected';const has=data.progress.some(x=>x.date===d);cells+=`<button class="${cls}" data-date="${d}">${Number(d.slice(-2))}${has?'<span class="cal-dot"></span>':''}</button>`}const logs=data.progress.filter(x=>x.date===selectedDate);return `${heading('Training calendar','Explore your practice history by date.')}<div class="grid dashboard-grid"><section class="panel calendar"><div class="cal-head"><button class="icon-btn" data-month="-1" aria-label="Previous month">‹</button><div class="cal-title">${monthCursor.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><button class="icon-btn" data-month="1" aria-label="Next month">›</button></div><div class="cal-grid">${labels.map(x=>`<div class="cal-day-label">${x}</div>`).join('')}${cells}</div><div class="item-meta" style="margin-top:13px"><span class="cal-dot" style="position:static"></span> Practice logged</div></section><section class="panel"><div class="panel-head"><h2>${dayLabel(selectedDate)}</h2><button class="btn btn-small" data-add="progress" data-date="${selectedDate}">＋ Log</button></div>${logs.length?`<div class="list">${logs.map(x=>`<article class="item-card"><div class="panel-head"><h3>${esc(x.title||'Practice session')}</h3><button class="btn btn-small" data-edit="progress" data-id="${esc(x.id)}">Edit</button></div><div class="item-meta">${Number(x.minutes)||0} minutes · Strength ${Number(x.strength)||0}m · Flexibility ${Number(x.flexibility)||0}m</div>${x.skills?.length?`<p>Skills: ${x.skills.map(esc).join(', ')}</p>`:''}${x.notes?`<p>${esc(x.notes)}</p>`:''}</article>`).join('')}</div>`:empty('No practice logged','Choose another day or add a session for this date.')}</section></div>`}
function makeBars(items){const max=Math.max(1,...items.map(x=>x.value));return `<div class="chart-box">${items.map(x=>`<div class="bar-group"><span class="bar-value">${x.value?`${x.value.toFixed(1)}h`:''}</span><div class="bar" style="height:${Math.max(x.value?4:1,(x.value/max)*72)}%"></div><span class="bar-label">${esc(x.label)}</span></div>`).join('')}</div>`}
function renderStats(){const now=new Date(),weekly=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;weekly.push({label:d.toLocaleDateString(undefined,{weekday:'short'}),value:data.progress.filter(x=>x.date===key).reduce((s,x)=>s+(Number(x.minutes)||0),0)/60})}const monthly=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;monthly.push({label:d.toLocaleDateString(undefined,{month:'short'}),value:data.progress.filter(x=>String(x.date||'').slice(0,7)===key).reduce((s,x)=>s+(Number(x.minutes)||0),0)/60})}return `${heading('Statistics','A clear picture of the work you are putting in.')}<div class="grid stats-grid">${stat('Total practice time',`${(totalMinutes()/60).toFixed(1)}h`,'All recorded practice','◷','#edf2ff')}${stat('Skills mastered',mastered(),'Marked mastered','✦','#f2edff')}${stat('Goals in progress',data.goals.filter(g=>Number(g.progress)<100).length,'Not yet complete','◎','#e8f7f5')}${stat('Active days',new Set(data.progress.map(x=>x.date)).size,'Days with logged practice','▦','#fff4e8')}</div><div class="grid two-col"><section class="panel"><div class="panel-head"><h2>Weekly activity</h2><span class="sub">Practice hours per day</span></div>${makeBars(weekly)}</section><section class="panel"><div class="panel-head"><h2>Monthly activity</h2><span class="sub">Practice hours per month</span></div>${makeBars(monthly)}</section></div><section class="panel"><div class="panel-head"><h2>Skills by apparatus</h2><span class="sub">Your tracked skills</span></div>${categories.map(c=>{const n=data.skills.filter(s=>s.category===c).length,m=data.skills.filter(s=>s.category===c&&s.status==='Mastered').length;return `<div class="row-card" style="margin-bottom:8px"><div class="row-main"><strong>${c}</strong><small>${m} mastered · ${n} tracked</small></div><div style="width:35%;max-width:190px"><div class="progress-track"><div class="progress-fill" style="width:${n?m/n*100:0}%"></div></div></div></div>`}).join('')}</section>`}
function renderSearch(q){const term=q.trim().toLowerCase();if(!term)return `${heading('Search','Search your skills, videos, articles, and posts.')}<div class="empty">Type in the search bar above to find content across GYMTRACK.</div>`;const hits=[];for(const [type,rows,fields] of [['Skill',data.skills,['name','category','status','notes']],['Video',data.videos,['title','description','category']],['Article',data.articles,['title','content','topic','author']],['Post',data.posts,['title','content','type','author']]])for(const item of rows)if(fields.some(k=>String(item[k]||'').toLowerCase().includes(term)))hits.push({type,item});return `${heading(`Search results`,`Results for “${esc(q)}”`)}<div class="search-results">${hits.length?hits.map(({type,item})=>`<button class="search-hit" data-search-open="${type.toLowerCase()}" data-id="${esc(item.id)}"><div style="text-align:left"><div class="search-type">${type}</div><strong>${esc(item.title||item.name)}</strong><div class="muted" style="font-size:11px">${esc(item.category||item.topic||item.type||'')}</div></div><span>Open →</span></button>`).join(''):empty('No matches','Try a different search term.')}</div>`}
const viewTitles={dashboard:'Dashboard',progress:'Progress log',skills:'Skill tracker',goals:'Goals',calendar:'Calendar',videos:'Video library',articles:'Articles',community:'Community',stats:'Statistics',search:'Search'};
function render(){const q=$('#globalSearch').value.trim();if(q)view='search';$('#pageTitle').textContent=viewTitles[view]||'Dashboard';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#content').innerHTML=({dashboard:renderDashboard,progress:renderProgress,skills:renderSkills,goals:renderGoals,calendar:renderCalendar,videos:renderVideos,articles:renderArticles,community:renderCommunity,stats:renderStats,search:()=>renderSearch(q)})[view]();$('#avatar').textContent=(data.profile.name||'G').slice(0,1).toUpperCase()}
const schemas={progress:{title:'Practice session',fields:[['title','Session title','text','Practice session'],['date','Date','date',today()],['minutes','Practice time (minutes)','number',''],['skills','Skills practiced (comma-separated)','text',''],['strength','Strength training (minutes)','number','0'],['flexibility','Flexibility training (minutes)','number','0'],['notes','Notes','textarea','']]},skill:{title:'Skill',fields:[['name','Skill name','text',''],['category','Category','select',categories],['status','Status','select',['Not Started','Learning','Almost There','Mastered']],['notes','Notes','textarea','']]},goal:{title:'Goal',fields:[['title','Goal','text',''],['description','Description','textarea',''],['due','Target date','date',''],['progress','Completion percentage','number','0']]},video:{title:'Video',fields:[['title','Video title','text',''],['url','YouTube link','url',''],['description','Description','textarea',''],['category','Category','select',['Beginner','Intermediate','Advanced','Flexibility','Strength','Tutorials']] ]},article:{title:'Article',fields:[['title','Title','text',''],['topic','Topic','select',['Training','Flexibility','Nutrition','Competitions','Mental Training']],['author','Author','text',''],['content','Article content','textarea','']]},post:{title:'Community post',fields:[['title','Post title','text',''],['author','Author','text',''],['type','Post type','select',['Progress update','Achievement','Training log','Question']],['content','Content','textarea','']]}};
function openForm(type,id='',date=''){const schema=schemas[type],existing=id?data[type==='progress'?'progress':type==='skill'?'skills':type==='goal'?'goals':type==='video'?'videos':type==='article'?'articles':'posts'].find(x=>x.id===id):null;$('#modalTitle').textContent=`${existing?'Edit':'Add'} ${schema.title.toLowerCase()}`;$('#modalBody').innerHTML=`<form id="dataForm" data-type="${type}" data-id="${esc(id)}"><div class="form-grid">${schema.fields.map(([name,label,kind,options])=>{let value=existing?.[name]??(name==='author'?data.profile.name||'':name==='date'?(date||today()):kind==='select'?options[0]:options);let input;if(kind==='select')input=`<select class="input" name="${name}">${options.map(o=>`<option ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(kind==='textarea')input=`<textarea class="input" name="${name}" ${name==='content'?'required':''}>${esc(value)}</textarea>`;else input=`<input class="input" name="${name}" type="${kind}" value="${esc(value)}" ${['title','name','url'].includes(name)?'required':''} ${name==='minutes'||name==='strength'||name==='flexibility'||name==='progress'?'min="0"':''} ${name==='progress'?'max="100"':''}>`;return `<div class="field ${kind==='textarea'?'full':''}"><label>${esc(label)}</label>${input}</div>`}).join('')}</div>${type==='progress'?'<p class="danger-note">Practice time is recorded in minutes. Enter 60 for one hour.</p>':''}<div class="modal-actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">${existing?'Save changes':'Save'}</button></div></form>`;$('#modal').showModal();$('#modalBody input:not([type=hidden]),#modalBody textarea').item?.focus?.()}
function collection(type){return type==='progress'?data.progress:type==='skill'?data.skills:type==='goal'?data.goals:type==='video'?data.videos:type==='article'?data.articles:data.posts}
function saveItem(type,item,id){const rows=collection(type),idx=rows.findIndex(x=>x.id===id);if(idx>=0)rows[idx]={...rows[idx],...item,updatedAt:Date.now()};else rows.unshift({...item,id:uid(),createdAt:Date.now(),updatedAt:Date.now()});if(item.author&&!data.profile.name&&['post','article'].includes(type))data.profile.name=item.author;return persist()}
function deleteItem(type,id){const names={progress:'practice session',skill:'skill',goal:'goal',video:'video',article:'article',post:'post'};if(!confirm(`Delete this ${names[type]}? This cannot be undone.`))return;const rows=collection(type),idx=rows.findIndex(x=>x.id===id);if(idx>=0){rows.splice(idx,1);persist();render();notify(`${names[type][0].toUpperCase()+names[type].slice(1)} deleted.`)}}
function playVideo(id){const v=data.videos.find(x=>x.id===id);if(!v)return;const safe=safeYouTube(v.url);if(!safe){notify('This video link is not a valid YouTube URL.',true);return}$('#modalTitle').textContent=v.title;$('#modalBody').innerHTML=`<iframe class="video-frame" src="${safe.embed}?autoplay=1" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><p class="muted">${esc(v.description||'')}</p><div class="modal-actions"><button class="btn" data-close>Close</button><a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">Open on YouTube ↗</a></div>`;$('#modal').showModal()}
function readArticle(id){const a=data.articles.find(x=>x.id===id);if(!a)return;$('#modalTitle').textContent=a.title;$('#modalBody').innerHTML=`<div class="item-meta"><span class="pill">${esc(a.topic)}</span><span>By ${esc(a.author||'Gymnast')}</span><span>${dayLabel(a.date)}</span></div><div style="white-space:pre-wrap;line-height:1.8">${esc(a.content)}</div><div class="modal-actions"><button class="btn" data-close>Close</button><button class="btn" data-edit="article" data-id="${esc(id)}">Edit</button></div>`;$('#modal').showModal()}
function activate(button){const type=button.dataset.add;if(type){openForm(type,'',button.dataset.date||'');return}if(button.dataset.go){view=button.dataset.go;$('#globalSearch').value='';render();return}if(button.dataset.edit){const type=button.dataset.edit,id=button.dataset.id;$('#modal').close();openForm(type,id);return}if(button.dataset.delete){deleteItem(button.dataset.delete,button.dataset.id);return}if(button.dataset.play){playVideo(button.dataset.play);return}if(button.dataset.readArticle){readArticle(button.dataset.readArticle);return}if(button.dataset.stepGoal){const g=data.goals.find(x=>x.id===button.dataset.stepGoal);if(g){g.progress=Math.min(100,(Number(g.progress)||0)+10);persist();render()}return}if(button.dataset.month){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+Number(button.dataset.month),1);render();return}if(button.dataset.date){selectedDate=button.dataset.date;monthCursor=new Date(Number(selectedDate.slice(0,4)),Number(selectedDate.slice(5,7))-1,1);render();return}if(button.dataset.like){const p=data.posts.find(x=>x.id===button.dataset.like);if(p){p.likes=p.likes||[];p.likes.includes('local-user')?p.likes=p.likes.filter(x=>x!=='local-user'):p.likes.push('local-user');persist();render()}return}if(button.dataset.searchOpen){const type=button.dataset.searchOpen,id=button.dataset.id;if(type==='video')playVideo(id);else if(type==='article')readArticle(id);else{view=type==='skill'?'skills':'community';$('#globalSearch').value='';render()}return}}
$('#content').addEventListener('click',e=>{const b=e.target.closest('button,a');if(b)activate(b)});
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){view=b.dataset.view;$('#globalSearch').value='';render()}});
$('#globalSearch').addEventListener('input',()=>{if($('#globalSearch').value.trim())view='search';else if(view==='search')view='dashboard';render()});
$('#content').addEventListener('change',e=>{if(e.target.id==='skillFilter'||e.target.id==='skillStatusFilter')$('#skillGrid').innerHTML=renderSkillCards();if(e.target.id==='videoFilter')$('#videoGrid').innerHTML=renderVideoCards();if(e.target.id==='articleFilter')$('#articleGrid').innerHTML=renderArticleCards()});
$('#content').addEventListener('submit',e=>{if(e.target.matches('[data-comment]')){e.preventDefault();const p=data.posts.find(x=>x.id===e.target.dataset.comment),text=new FormData(e.target).get('comment').trim();if(p&&text){p.comments=p.comments||[];p.comments.push({text,author:data.profile.name||'Gymnast',date:today()});persist();render()}}});
$('#modalBody').addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){$('#modal').close();return}const edit=e.target.closest('[data-edit]');if(edit)activate(edit)});
$('#modalBody').addEventListener('submit',e=>{if(!e.target.matches('#dataForm'))return;e.preventDefault();const form=e.target,type=form.dataset.type,id=form.dataset.id,fd=new FormData(form),item={};for(const [key,value]of fd.entries())item[key]=typeof value==='string'?value.trim():value;if(type==='progress'){item.minutes=Math.max(0,Number(item.minutes)||0);item.strength=Math.max(0,Number(item.strength)||0);item.flexibility=Math.max(0,Number(item.flexibility)||0);item.skills=String(item.skills||'').split(',').map(x=>x.trim()).filter(Boolean)}if(type==='goal')item.progress=Math.max(0,Math.min(100,Number(item.progress)||0));if(type==='skill'&& !categories.includes(item.category)){notify('Choose a valid category.',true);return}if(type==='video'&&!safeYouTube(item.url)){notify('Enter a valid YouTube video link.',true);return}if(type==='video'&&!item.title){notify('A video title is required.',true);return}if(type==='article'){item.date=id?(data.articles.find(a=>a.id===id)?.date||today()):today()}if(type==='post'){item.date=id?(data.posts.find(p=>p.id===id)?.date||today()):today();if(!id){item.likes=[];item.comments=[]}}if(saveItem(type,item,id)){ $('#modal').close();render();notify(id?'Changes saved.':'Saved successfully.')}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});
render();
</script>
</body>
</html>
